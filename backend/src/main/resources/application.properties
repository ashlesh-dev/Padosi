spring.application.name=padosi-backend
server.port=8080

# ---------------------------------------------------------------------------
# Optional local secrets file: backend/.env  (KEY=value per line, NOT committed).
# Real environment variables take priority over this file.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]

# ---------------------------------------------------------------------------
# Supabase PostgreSQL connection - ALL values come from environment variables.
#   DB_HOST     e.g. aws-0-ap-south-1.pooler.supabase.com
#   DB_PORT     5432 (session pooler / direct)
#   DB_NAME     postgres
#   DB_USER     e.g. postgres.<project-ref>
#   DB_PASSWORD your database password
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small: Supabase limits the number of connections
spring.datasource.hikari.maximum-pool-size=5

# ---------------------------------------------------------------------------
# JPA / Hibernate
# The tables already exist (database/schema.sql), so Hibernate must NOT touch them.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Security (Step 3)
#   JWT_SECRET  at least 32 random characters (required, never commit it)
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
# Origin of the Vite dev server (comma-separated list allowed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# We use our own JWT login, so skip Spring's auto-generated default user/password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
